services:
  telco_fastapi_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telco_fastapi_backend
    ports:
      - "8000:8000"
    restart: always
    networks:
      - telco_network

  telco_streamlit_frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: telco_streamlit_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://telco_fastapi_backend:8000
    depends_on:
      telco_fastapi_backend:
        condition: service_healthy
    restart: always
    networks:
      - telco_network

networks:
  telco_network:
    driver: bridge
