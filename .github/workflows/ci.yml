name: Telco Churn CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Unit Tests (All 8 Pipeline Tests)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "."
      MLFLOW_ALLOW_FILE_STORE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Pytest Pipeline
        run: |
          pytest tests/test_pipeline.py -v --cov=src

  docker:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: hwcdxx
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            hwcdxx/telco-fastapi:latest
            hwcdxx/telco-fastapi:${{ github.sha }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.streamlit
          push: true
          tags: |
            hwcdxx/telco-streamlit:latest
            hwcdxx/telco-streamlit:${{ github.sha }}
